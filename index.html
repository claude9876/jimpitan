<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimpitan Warga RT02 Dukuh Kepuh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-20">
        <!-- Header -->
        <header class="bg-teal-600 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">Jimpitan Warga RT02</h1>
                <p class="text-xs font-light">Dukuh Kepuh</p>
            </div>
            <button onclick="sinkronData()" class="bg-teal-700 text-white text-xs px-3 py-1.5 rounded-full hover:bg-teal-800 transition flex items-center gap-1 shadow-sm">
                <svg id="icon-sync" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>Sync Data</span>
            </button>
        </header>

        <!-- Main Content -->
        <main class="p-4">
            
            <!-- TAB 1: Dashboard (Rekap) -->
            <div id="tab-dashboard" class="tab-content active">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-bold">Dashboard Setoran</h2>
                    <span id="sync-status" class="text-[10px] text-gray-400">Sinkronisasi...</span>
                </div>
                <div class="bg-teal-100 p-4 rounded-lg mb-4 text-center shadow-sm">
                    <p class="text-sm text-teal-700">Total Kas Terkumpul</p>
                    <h3 id="total-kas" class="text-2xl font-bold text-teal-900">Rp 0</h3>
                </div>
                <div id="dashboard-list" class="space-y-3">
                    <!-- List rekap per warga akan muncul di sini -->
                </div>
            </div>

            <!-- TAB 2: Input Iuran -->
            <div id="tab-input" class="tab-content">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">Input Iuran Mingguan</h2>
                <form id="form-iuran" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Warga</label>
                        <select id="select-warga" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-teal-500 focus:border-teal-500">
                            <option value="">-- Pilih Warga --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nominal (Rp)</label>
                        <input type="number" id="input-nominal" required min="1" step="1" class="w-full border border-gray-300 rounded-md p-2 focus:ring-teal-500 focus:border-teal-500" placeholder="Contoh: 5000">
                    </div>
                    <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2 px-4 rounded-md hover:bg-teal-700 transition">Simpan Iuran</button>
                </form>
            </div>

            <!-- TAB 3: Riwayat -->
            <div id="tab-riwayat" class="tab-content">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">Riwayat Transaksi (Google Sheets)</h2>
                <div id="riwayat-list" class="space-y-3">
                    <!-- Riwayat akan muncul di sini -->
                </div>
            </div>

            <!-- TAB 4: Data Warga -->
            <div id="tab-warga" class="tab-content">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">Kelola Data Warga</h2>
                <form id="form-warga" class="flex gap-2 mb-4">
                    <input type="text" id="input-nama-warga" required class="flex-1 border border-gray-300 rounded-md p-2" placeholder="Nama Warga Baru">
                    <button type="submit" class="bg-gray-800 text-white px-4 rounded-md hover:bg-gray-900">Tambah</button>
                </form>
                <ul id="warga-list" class="divide-y divide-gray-200">
                    <!-- Daftar warga akan muncul di sini -->
                </ul>
            </div>

        </main>

        <!-- Footer -->
        <footer class="mt-8 pb-24 text-center text-xs text-gray-400">
            <p>Powered by RESPEK</p>
            <p>© 2026 Pemuda RESPEK (Revolusi Pemuda Kepuh)</p>
        </footer>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full max-w-md flex justify-around p-2 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-20">
            <button data-tab="dashboard" onclick="switchTab('dashboard')" class="nav-btn text-teal-600 flex flex-col items-center p-2 w-1/4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span class="text-[10px] mt-1">Dashboard</span>
            </button>
            <button data-tab="input" onclick="switchTab('input')" class="nav-btn text-gray-400 hover:text-teal-600 flex flex-col items-center p-2 w-1/4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span class="text-[10px] mt-1">Input</span>
            </button>
            <button data-tab="riwayat" onclick="switchTab('riwayat')" class="nav-btn text-gray-400 hover:text-teal-600 flex flex-col items-center p-2 w-1/4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="text-[10px] mt-1">Riwayat</span>
            </button>
            <button data-tab="warga" onclick="switchTab('warga')" class="nav-btn text-gray-400 hover:text-teal-600 flex flex-col items-center p-2 w-1/4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="text-[10px] mt-1">Warga</span>
            </button>
        </nav>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzvxLSOst29Ms1fn5aF9gGagvrpkJHBZAWXVR2BXc_jmNnSLI73TAmUZYsxMCLMKGSHRA/exec';

        // Data disimpan di memori dan dimuat/disimpan lewat window.storage (lihat catatan di bawah).
        let dataWarga = [];
        let dataTransaksi = [];

        const formatRupiah = (angka) => 'Rp ' + Number(angka || 0).toLocaleString('id-ID');

        // Mencegah nama warga / data dari Google Sheets merusak tampilan (HTML injection).
        const escapeHtml = (str) => String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

        const getWaktuSekarang = () => {
            const now = new Date();
            const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][now.getDay()];
            const tanggal = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
            const jam = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            return `${hari}, ${tanggal} - ${jam} WIB`;
        };

        // --- Penyimpanan lokal (persisten antar sesi) ---
        // Catatan: data ini dibagikan (shared) ke siapa pun yang membuka artifact ini,
        // sama seperti data di Google Sheets yang juga sudah bersifat bersama.
        async function getStored(key) {
            try {
                const result = await window.storage.get(key, true);
                return result && result.value ? JSON.parse(result.value) : null;
            } catch (err) {
                // Key belum pernah dibuat, atau storage tidak tersedia — anggap kosong.
                return null;
            }
        }

        async function setStored(key, value) {
            try {
                await window.storage.set(key, JSON.stringify(value), true);
            } catch (err) {
                console.error(`Gagal menyimpan data "${key}":`, err);
            }
        }

        // Fungsi Membaca / Menarik Data dari Google Sheets
        async function sinkronData() {
            const syncStatus = document.getElementById('sync-status');
            const iconSync = document.getElementById('icon-sync');

            syncStatus.innerText = 'Memuat data...';
            iconSync.classList.add('animate-spin');

            try {
                // cache: 'no-store' mencegah browser memakai respons GET lama yang ter-cache,
                // yang bisa membuat baris yang sudah dihapus di Sheet tetap muncul di aplikasi.
                const response = await fetch(SCRIPT_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const dataFromSheet = await response.json();

                if (Array.isArray(dataFromSheet)) {
                    // Sheet adalah sumber data utama: array lama diganti total (bukan digabung),
                    // jadi baris yang dihapus di Sheet otomatis ikut hilang di sini.
                    dataTransaksi = dataFromSheet;
                    await setStored('jimpitan_transaksi', dataTransaksi);

                    // Otomatis tambahkan nama warga baru ke list jika belum ada di dataWarga
                    let adaWargaBaru = false;
                    dataFromSheet.forEach(item => {
                        if (item.nama_warga && !dataWarga.some(w => w.nama.toLowerCase() === item.nama_warga.toLowerCase())) {
                            dataWarga.push({ id: Date.now().toString() + Math.random(), nama: item.nama_warga });
                            adaWargaBaru = true;
                        }
                    });
                    if (adaWargaBaru) {
                        await setStored('jimpitan_warga', dataWarga);
                    }

                    syncStatus.innerText = 'Tersinkronasi';
                } else {
                    syncStatus.innerText = 'Format data tidak sesuai';
                }
            } catch (error) {
                console.error('Gagal sinkronisasi data:', error);
                // Kemungkinan besar karena deployment Apps Script belum diatur akses "Siapa saja",
                // atau ada masalah CORS — jadi data lama (termasuk yang sudah dihapus di Sheet)
                // masih tampil sampai sync berhasil.
                syncStatus.innerText = 'Gagal Sync - cek akses deployment';
            } finally {
                iconSync.classList.remove('animate-spin');
                updateUI();
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-teal-600');
                el.classList.add('text-gray-400');
            });

            const targetTab = document.getElementById(`tab-${tabId}`);
            if (targetTab) targetTab.classList.add('active');

            // Cari tombol nav lewat atribut data-tab, bukan lewat `event` global,
            // supaya tetap benar walau switchTab dipanggil dari kode (bukan klik langsung).
            const targetBtn = document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
            if (targetBtn) {
                targetBtn.classList.remove('text-gray-400');
                targetBtn.classList.add('text-teal-600');
            }

            updateUI();
        }

        // Tambah Warga
        document.getElementById('form-warga').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputEl = document.getElementById('input-nama-warga');
            const nama = inputEl.value.trim();
            if (!nama) return;

            const sudahAda = dataWarga.some(w => w.nama.toLowerCase() === nama.toLowerCase());
            if (sudahAda) {
                alert('Nama warga tersebut sudah ada di daftar!');
                return;
            }

            dataWarga.push({ id: Date.now().toString(), nama });
            await setStored('jimpitan_warga', dataWarga);
            inputEl.value = '';
            updateUI();
            alert('Warga berhasil ditambahkan!');
        });

        // Input Iuran & Kirim ke Google Sheets
        document.getElementById('form-iuran').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btnSubmit = e.target.querySelector('button');
            const originalText = btnSubmit.innerText;
            btnSubmit.innerText = 'Menyimpan...';
            btnSubmit.disabled = true;

            const wargaId = document.getElementById('select-warga').value;
            const nominalInput = document.getElementById('input-nominal');
            const nominal = parseInt(nominalInput.value, 10);

            if (!wargaId) {
                btnSubmit.innerText = originalText;
                btnSubmit.disabled = false;
                return alert('Pilih warga terlebih dahulu!');
            }

            if (!Number.isFinite(nominal) || nominal <= 0) {
                btnSubmit.innerText = originalText;
                btnSubmit.disabled = false;
                return alert('Masukkan nominal yang valid (lebih dari 0)!');
            }

            const namaWarga = dataWarga.find(w => w.id === wargaId)?.nama;
            const waktu = getWaktuSekarang();
            const idTransaksi = Date.now().toString();

            const payload = {
                id_transaksi: idTransaksi,
                waktu: waktu,
                nama_warga: namaWarga,
                nominal: nominal
            };

            // Update UI & simpan lokal langsung, baru kirim ke Google Sheets di belakang layar
            dataTransaksi.push(payload);
            await setStored('jimpitan_transaksi', dataTransaksi);

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                setTimeout(sinkronData, 1000); // Sinkronkan ulang data setelah 1 detik
            } catch (error) {
                console.error('Gagal mengirim data ke server:', error);
                // Data tetap tersimpan secara lokal walau pengiriman ke Sheets gagal.
            }

            nominalInput.value = '';
            document.getElementById('select-warga').value = '';
            alert('Iuran berhasil dicatat!');
            switchTab('dashboard');

            btnSubmit.innerText = originalText;
            btnSubmit.disabled = false;
        });

        async function hapusWarga(id) {
            if (confirm('Yakin ingin menghapus warga dari opsi pilihan?')) {
                dataWarga = dataWarga.filter(w => w.id !== id);
                await setStored('jimpitan_warga', dataWarga);
                updateUI();
            }
        }

        function updateUI() {
            // Update Select Option & List Warga
            const selectWarga = document.getElementById('select-warga');
            const wargaList = document.getElementById('warga-list');
            const nilaiTerpilih = selectWarga.value;
            selectWarga.innerHTML = '<option value="">-- Pilih Warga --</option>';
            wargaList.innerHTML = '';

            dataWarga.forEach(w => {
                const option = document.createElement('option');
                option.value = w.id;
                option.textContent = w.nama;
                selectWarga.appendChild(option);

                wargaList.innerHTML += `
                    <li class="py-3 flex justify-between items-center">
                        <span class="font-medium text-gray-700">${escapeHtml(w.nama)}</span>
                        <button onclick="hapusWarga('${w.id}')" class="text-red-500 text-sm hover:underline">Hapus</button>
                    </li>
                `;
            });
            selectWarga.value = nilaiTerpilih; // pertahankan pilihan jika masih ada

            // Update Dashboard (Rekap)
            const dashboardList = document.getElementById('dashboard-list');
            dashboardList.innerHTML = '';
            let totalKas = 0;

            if (dataWarga.length === 0) {
                dashboardList.innerHTML = '<p class="text-center text-sm text-gray-400 mt-4">Belum ada data warga</p>';
            }

            dataWarga.forEach(w => {
                const totalSetoranWarga = dataTransaksi
                    .filter(t => (t.nama_warga || '').toLowerCase() === w.nama.toLowerCase())
                    .reduce((sum, current) => sum + Number(current.nominal || 0), 0);

                totalKas += totalSetoranWarga;

                dashboardList.innerHTML += `
                    <div class="bg-white border rounded-lg p-3 flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="bg-teal-100 p-2 rounded-full text-teal-600">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
                            </div>
                            <span class="font-semibold text-gray-700">${escapeHtml(w.nama)}</span>
                        </div>
                        <span class="font-bold text-teal-600">${formatRupiah(totalSetoranWarga)}</span>
                    </div>
                `;
            });
            document.getElementById('total-kas').textContent = formatRupiah(totalKas);

            // Update Riwayat Transaksi (Dibalik agar yang terbaru di atas)
            const riwayatList = document.getElementById('riwayat-list');
            riwayatList.innerHTML = '';

            const sortedTransaksi = [...dataTransaksi].reverse();

            sortedTransaksi.forEach(t => {
                riwayatList.innerHTML += `
                    <div class="bg-white border-l-4 border-teal-500 p-3 rounded shadow-sm">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-gray-800">${escapeHtml(t.nama_warga || 'Warga')}</span>
                            <span class="font-bold text-green-600">+${formatRupiah(t.nominal)}</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">${escapeHtml(t.waktu)}</p>
                    </div>
                `;
            });

            if (sortedTransaksi.length === 0) {
                riwayatList.innerHTML = '<p class="text-center text-sm text-gray-400 mt-4">Belum ada transaksi</p>';
            }
        }

        // Muat data tersimpan, tampilkan, lalu sinkronkan dengan Google Sheets saat aplikasi dibuka
        async function initApp() {
            dataWarga = (await getStored('jimpitan_warga')) || [];
            dataTransaksi = (await getStored('jimpitan_transaksi')) || [];
            updateUI();
            await sinkronData();
        }

        initApp();
    </script>
</body>
</html>
